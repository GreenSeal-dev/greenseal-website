baseurl: ''
url: "https://www.greenseal.dev"
permalink: pretty
title: 'GreenSeal.dev'
tagline: Energy-efficient AI & software engineering
description: >
  Peer-reviewed, engineering-driven services to reduce energy consumption
  and infrastructure costs in AI, cloud, and edge systems. Specialists in
  energy benchmarking, TinyML, and on-device inference efficiency.
default_image: '/images/logo/og-default.jpg'

logo:
  mobile: "images/logo/logo-mobile.svg"
  mobile_height: "32px"
  mobile_width: "32px"
  desktop: "images/logo/logo.svg"
  desktop_height: "32px"
  desktop_width: "220px"

home:
  limit_services: 6

# Green Software Practices (GSP) has its own site. The old /gsp/ pages redirect there.
gsp_url: "https://gsp.greenseal.dev"

collections:
  services:
    output: true
    sort_by: weight
  team:
    output: true

defaults:
  - scope:
      path: ""
      type: "services"
    values:
      layout: "service"
  - scope:
      path: ""
      type: "team"
    values:
      layout: "team"

sass:
  style: compressed # possible values: nested expanded compact compressed

plugins:
  - jekyll-environment-variables
  - jekyll-sitemap
  - jekyll-redirect-from

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md

